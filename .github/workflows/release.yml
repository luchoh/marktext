name: Release

permissions:
  attestations: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - 'release-v*'

jobs:
  unix:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    timeout-minutes: 45

    strategy:
      matrix:
        os: [macos-11, ubuntu-24.04]

    env:
      DISPLAY: ":99.0"
      MARKTEXT_IS_STABLE: 1
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install build dependencies
        if: runner.os == 'Linux'
        #                         electron-builder                 | keyboard-layout         | keytar                      | fontmanager     | RPM on Ubuntu
        run: |
          sudo apt-get -y update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm xvfb

      - name: Cache node_modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node_modules-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-cache-v3-

      - name: Cache Electron
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ env.HOME }}/.cache/electron
          key: ${{ runner.os }}-electron-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Cache Electron-Builder
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ env.HOME }}/.cache//electron-builder
          key: ${{ runner.os }}-electron-builder-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Install dependencies
        run: yarn install --check-files --frozen-lockfile

      - name: Strip ripgrep on Linux
        if: runner.os == 'Linux'
        run: strip node_modules/vscode-ripgrep/bin/rg

      - name: Lint
        run: |
          yarn run lint
          yarn run security:check
          yarn run validate-licenses

      - name: Run unit and E2E tests
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn run test

      - name: Run unit and E2E tests
        if: runner.os != 'Linux'
        run: yarn run test

      - name: Build and release
        run: |
              if [ "$RUNNER_OS" == "Linux" ]; then
                yarn run release:linux --publish always
              elif [ "$RUNNER_OS" == "macOS" ]; then
                yarn run release:mac --publish always
              else
                echo "$RUNNER_OS not supported"
                exit 1
              fi

      - name: Generate release metadata
        run: yarn run release:metadata build

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-checksums: build/SHA256SUMS.txt

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-checksums: build/SHA256SUMS.txt
          sbom-path: build/sbom.cyclonedx.json

      - name: Show generated checksums
        run: cat build/SHA256SUMS.txt
        shell: bash

      - name: Upload release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-metadata-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/SHA256SUMS.txt
            build/release-metadata.json
            build/dependency-inventory.json
            build/sbom.cyclonedx.json
            build/provenance.json

  windows:
    runs-on: windows-2022
    continue-on-error: false
    timeout-minutes: 45

    env:
      MARKTEXT_IS_STABLE: 1
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      # Workaround: Fix native build failure due to outdated node-gyp version.
      - name: Fix node-gyp
        run: |
          npm install --global node-gyp@11.4.2
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}
          node-gyp install
        shell: pwsh

      - name: Cache node_modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ github.workspace }}\node_modules
          key: ${{ runner.os }}-node_modules-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-cache-v3-

      - name: Cache Electron
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: ${{ runner.os }}-electron-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Cache Electron-Builder
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ env.LOCALAPPDATA }}\electron-builder\cache
          key: ${{ runner.os }}-electron-builder-cache-v3-${{ hashFiles('.node-version', 'yarn.lock') }}

      - name: Install dependencies
        run: yarn install --check-files --frozen-lockfile

      - name: Lint
        run: |
          yarn run lint
          yarn run security:check
          yarn run validate-licenses

      - name: Run unit and E2E tests
        run: yarn run test

      - name: Build and release
        run: yarn run release:win --publish always

      - name: Generate release metadata
        run: yarn run release:metadata build

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-checksums: build/SHA256SUMS.txt

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-checksums: build/SHA256SUMS.txt
          sbom-path: build/sbom.cyclonedx.json

      - name: Show generated checksums
        run: Get-Content "build/SHA256SUMS.txt"
        shell: pwsh

      - name: Upload release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-metadata-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/SHA256SUMS.txt
            build/release-metadata.json
            build/dependency-inventory.json
            build/sbom.cyclonedx.json
            build/provenance.json
